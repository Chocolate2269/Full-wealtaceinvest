    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0b0e1a;
            --bg-secondary: #12172b;
            --bg-card: #1a2140;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-gradient: linear-gradient(135deg, #6c5ce7, #fd79a8);
            --text-white: #f0f2fa;
            --text-muted: #9aa1c5;
            --border-glow: rgba(108, 92, 231, 0.25);
            --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #55efc4;
            --danger: #ff6b6b;
            --warning: #fdcb6e;
            --gold: #f9ca24;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
        }
        .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 36px rgba(108, 92, 231, 0.5); }
        .btn-outline { background: transparent; box-shadow: none; border: 1.5px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.06); border-color: var(--accent-light); box-shadow: 0 8px 24px rgba(108, 92, 231, 0.15); }
        .btn-sm { padding: 10px 22px; font-size: 0.85rem; }
        .btn-success { background: linear-gradient(135deg, #00b894, #55efc4); box-shadow: 0 8px 24px rgba(0, 184, 148, 0.35); }
        .btn-danger { background: linear-gradient(135deg, #e17055, #ff6b6b); box-shadow: 0 8px 24px rgba(225, 112, 85, 0.35); }
        .btn-gold { background: linear-gradient(135deg, #f9ca24, #f0932b); box-shadow: 0 8px 24px rgba(249, 202, 36, 0.35); color: #0b0e1a; }
        .btn-warning { background: linear-gradient(135deg, #fdcb6e, #f39c12); box-shadow: 0 8px 24px rgba(253, 203, 110, 0.35); color: #0b0e1a; }
        .btn-admin { background: linear-gradient(135deg, #6c5ce7, #a29bfe); box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35); border: 1px solid rgba(108, 92, 231, 0.3); }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 18px 0;
            background: rgba(11, 14, 26, 0.7); backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04); transition: var(--transition);
        }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; cursor: pointer; }
        .logo i { font-size: 1.8rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; align-items: center; gap: 36px; }
        .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); transition: var(--transition); position: relative; cursor: pointer; }
        .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--accent-gradient); transition: var(--transition); }
        .nav-links a:hover { color: #fff; }
        .nav-links a:hover::after { width: 100%; }
        .nav-actions { display: flex; align-items: center; gap: 16px; }
        .nav-actions .user-info { display: flex; align-items: center; gap: 12px; color: var(--text-white); font-weight: 500; }
        .nav-actions .user-info .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
        .hamburger span { width: 26px; height: 2.5px; background: var(--text-white); border-radius: 4px; transition: var(--transition); }

        /* ===== HERO ===== */
        .hero { padding: 140px 0 80px; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -40%; right: -20%; width: 700px; height: 700px; background: radial-gradient(circle, rgba(108, 92, 231, 0.12), transparent 70%); pointer-events: none; }
        .hero .container { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; position: relative; z-index: 2; }
        .hero-content h1 { font-size: 3.8rem; font-weight: 800; line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 20px; }
        .hero-content h1 .highlight { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-content p { font-size: 1.15rem; color: var(--text-muted); max-width: 460px; margin-bottom: 36px; line-height: 1.7; }
        .hero-buttons { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
        .hero-stats { display: flex; gap: 48px; margin-top: 48px; padding-top: 32px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
        .hero-stats .stat h3 { font-size: 2rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-stats .stat p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
        .hero-visual { display: flex; justify-content: center; align-items: center; }
        .chart-card { background: var(--bg-secondary); border-radius: var(--radius); padding: 32px 28px 28px; width: 100%; max-width: 480px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: var(--shadow-card); backdrop-filter: blur(4px); transition: var(--transition); }
        .chart-card:hover { border-color: var(--border-glow); transform: translateY(-4px); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .chart-header h4 { font-weight: 600; font-size: 0.95rem; }
        .chart-header .badge { background: rgba(108, 92, 231, 0.2); color: var(--accent-light); padding: 4px 14px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; }
        .chart-bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; margin-bottom: 20px; }
        .chart-bars .bar { flex: 1; border-radius: 8px 8px 0 0; background: var(--accent-gradient); opacity: 0.7; transition: var(--transition); min-height: 20px; }
        .chart-bars .bar:nth-child(1) { height: 45%; } .chart-bars .bar:nth-child(2) { height: 70%; } .chart-bars .bar:nth-child(3) { height: 55%; } .chart-bars .bar:nth-child(4) { height: 90%; } .chart-bars .bar:nth-child(5) { height: 65%; } .chart-bars .bar:nth-child(6) { height: 80%; } .chart-bars .bar:nth-child(7) { height: 40%; }
        .chart-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .chart-footer .up { color: #55efc4; font-weight: 600; }

        .section-title { text-align: center; margin-bottom: 56px; }
        .section-title h2 { font-size: 2.6rem; font-weight: 700; letter-spacing: -1px; }
        .section-title h2 .highlight { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-title p { color: var(--text-muted); max-width: 500px; margin: 12px auto 0; font-size: 1.05rem; }

        .features { padding: 80px 0; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 28px; }
        .feature-card { background: var(--bg-secondary); padding: 32px 28px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.04); transition: var(--transition); box-shadow: var(--shadow-card); }
        .feature-card:hover { border-color: var(--border-glow); transform: translateY(-6px); background: var(--bg-card); }
        .feature-card .icon { width: 52px; height: 52px; border-radius: 16px; background: rgba(108, 92, 231, 0.15); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--accent-light); margin-bottom: 18px; }
        .feature-card h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .feature-card p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; }

        .plans { padding: 80px 0; background: var(--bg-secondary); }
        .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px; }
        .plan-card { background: var(--bg-primary); border-radius: var(--radius); padding: 36px 28px 32px; border: 1px solid rgba(255, 255, 255, 0.05); transition: var(--transition); text-align: center; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
        .plan-card:hover { border-color: var(--border-glow); transform: translateY(-6px); }
        .plan-card.popular { border-color: var(--gold); background: var(--bg-card); }
        .plan-card.popular::before { content: 'Most Popular'; position: absolute; top: 14px; right: 14px; background: linear-gradient(135deg, #f9ca24, #f0932b); padding: 4px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.3px; color: #0b0e1a; }
        .plan-card .plan-name { font-size: 1.1rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .plan-card .price { font-size: 2.8rem; font-weight: 700; margin: 12px 0 4px; }
        .plan-card .price span { font-size: 1rem; font-weight: 400; color: var(--text-muted); }
        .plan-card .plan-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .plan-card ul { text-align: left; margin: 20px 0 28px; padding: 0 8px; }
        .plan-card ul li { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 0.9rem; color: var(--text-muted); border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .plan-card ul li:last-child { border-bottom: none; }
        .plan-card ul li i { color: #55efc4; font-size: 0.8rem; width: 18px; }
        .plan-card .btn { width: 100%; justify-content: center; }

        .cta { padding: 80px 0; text-align: center; background: var(--bg-primary); position: relative; }
        .cta::before { content: ''; position: absolute; bottom: -40%; left: -20%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(108, 92, 231, 0.06), transparent 70%); pointer-events: none; }
        .cta .container { position: relative; z-index: 2; }
        .cta h2 { font-size: 2.8rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 14px; }
        .cta p { color: var(--text-muted); font-size: 1.1rem; max-width: 480px; margin: 0 auto 36px; }
        .cta .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; }

        footer { padding: 48px 0 32px; border-top: 1px solid rgba(255, 255, 255, 0.04); background: var(--bg-secondary); }
        footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; }
        footer .footer-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
        footer .footer-brand i { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        footer .footer-links { display: flex; gap: 28px; flex-wrap: wrap; }
        footer .footer-links a { color: var(--text-muted); font-size: 0.85rem; transition: var(--transition); }
        footer .footer-links a:hover { color: #fff; }
        footer .footer-social { display: flex; gap: 16px; }
        footer .footer-social a { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.04); display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: var(--transition); border: 1px solid transparent; }
        footer .footer-social a:hover { border-color: var(--border-glow); color: #fff; background: rgba(108, 92, 231, 0.12); }
        footer .footer-bottom { margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.04); text-align: center; width: 100%; font-size: 0.8rem; color: var(--text-muted); }

        /* ===== DASHBOARDS ===== */
        .dashboard { display: none; padding: 120px 0 60px; min-height: 100vh; }
        .dashboard.active { display: block; }

        .dash-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 36px; }
        .dash-header h1 { font-size: 2.2rem; font-weight: 700; }
        .dash-header h1 i { color: var(--accent-light); margin-right: 12px; }
        .dash-header .dash-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 36px; }
        .stat-card { background: var(--bg-secondary); padding: 24px 28px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: var(--shadow-card); transition: var(--transition); }
        .stat-card:hover { border-color: var(--border-glow); transform: translateY(-3px); }
        .stat-card .stat-number { font-size: 2.4rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .stat-label { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; display: flex; align-items: center; gap: 6px; }

        .country-filter-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; background: var(--bg-secondary); padding: 14px 24px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.04); }
        .country-filter-wrap label { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
        .country-filter-wrap select { padding: 8px 16px; border-radius: 12px; background: var(--bg-primary); color: var(--text-white); border: 1px solid rgba(255, 255, 255, 0.06); font-family: inherit; font-size: 0.9rem; min-width: 180px; cursor: pointer; }
        .country-filter-wrap select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2); }
        .country-filter-wrap .filter-count { color: var(--text-muted); font-size: 0.8rem; margin-left: auto; }
        .country-filter-wrap .filter-count strong { color: var(--text-white); }

        .admin-add-user { background: var(--bg-secondary); border-radius: var(--radius); padding: 28px 32px; border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: var(--shadow-card); margin-bottom: 28px; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 16px; align-items: end; }
        .admin-add-user .field { display: flex; flex-direction: column; gap: 4px; }
        .admin-add-user .field label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .admin-add-user .field input, .admin-add-user .field select { padding: 12px 16px; border-radius: 12px; background: var(--bg-primary); border: 1px solid rgba(255, 255, 255, 0.06); color: var(--text-white); font-size: 0.9rem; font-family: inherit; }
        .admin-add-user .field input:focus, .admin-add-user .field select:focus { outline: none; border-color: var(--accent); }
        .admin-add-user .btn { padding: 12px 24px; white-space: nowrap; height: 48px; }

        .table-wrapper { background: var(--bg-secondary); border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.04); overflow: hidden; box-shadow: var(--shadow-card); }
        .table-wrapper table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .table-wrapper th { text-align: left; padding: 18px 24px; background: rgba(255, 255, 255, 0.03); font-weight: 600; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .table-wrapper td { padding: 16px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); color: var(--text-white); vertical-align: middle; }
        .table-wrapper tr:last-child td { border-bottom: none; }
        .table-wrapper tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .table-wrapper .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-gradient); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.8rem; color: #fff; margin-right: 12px; }
        .table-wrapper .location-tag { display: inline-block; padding: 4px 14px; border-radius: 40px; background: rgba(108, 92, 231, 0.15); color: var(--accent-light); font-size: 0.75rem; font-weight: 500; }
        .table-wrapper .status-badge { display: inline-block; padding: 4px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
        .status-badge.active { background: rgba(85, 239, 196, 0.15); color: #55efc4; }
        .status-badge.pending { background: rgba(253, 203, 110, 0.15); color: #fdcb6e; }
        .table-wrapper .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition); font-size: 0.85rem; padding: 6px 10px; border-radius: 8px; margin: 0 2px; }
        .table-wrapper .action-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
        .table-wrapper .action-btn.success:hover { color: var(--success); background: rgba(85, 239, 196, 0.1); }
        .table-wrapper .action-btn.warning:hover { color: var(--warning); background: rgba(253, 203, 110, 0.1); }
        .table-wrapper .action-btn.danger:hover { color: var(--danger); background: rgba(255, 107, 107, 0.1); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; color: var(--bg-card); margin-bottom: 16px; }
        .empty-state h3 { color: var(--text-white); margin-bottom: 8px; }

        .client-balance { background: var(--bg-secondary); border-radius: var(--radius); padding: 32px 36px; border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: var(--shadow-card); margin-bottom: 28px; text-align: center; }
        .client-balance .balance-amount { font-size: 3.6rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .client-balance .balance-label { color: var(--text-muted); font-size: 1rem; margin-top: 4px; }
        .client-balance .client-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .client-balance .balance-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .client-transactions { background: var(--bg-secondary); border-radius: var(--radius); padding: 24px 28px; border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: var(--shadow-card); }
        .client-transactions h3 { font-weight: 600; margin-bottom: 16px; color: var(--text-muted); }
        .client-transactions .tx-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.9rem; }
        .client-transactions .tx-item:last-child { border-bottom: none; }
        .client-transactions .tx-item .tx-amount.positive { color: var(--success); }
        .client-transactions .tx-item .tx-amount.negative { color: var(--danger); }
        .client-transactions .tx-item .tx-date { color: var(--text-muted); font-size: 0.8rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-secondary); border-radius: var(--radius); padding: 40px 36px; max-width: 560px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6); animation: modalIn 0.3s ease; max-height: 90vh; overflow-y: auto; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal .modal-close { float: right; background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; transition: var(--transition); }
        .modal .modal-close:hover { color: #fff; transform: rotate(90deg); }
        .modal h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; margin-top: 4px; }
